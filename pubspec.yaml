name: trellis
description: "The Trellis — a Rule of Life, kept with a Witness. Habit tracking and discipleship for Runners, Witnesses, and church leaders."
publish_to: 'none' # A private app; never published to pub.dev.

# build-name+build-number. In CI the build number is overridden with
# --build-number (auto-incremented from the store's latest), so this is the
# marketing version and the local-build default.
version: 1.0.0+1

environment:
  sdk: ^3.13.3
  flutter: ">=3.44.0"

# Every direct dependency is pinned to the exact version this release was
# built and tested with (they match pubspec.lock). Upgrade deliberately — one
# package at a time, `flutter pub upgrade <name>` — never by loosening a range.
# CI runs `flutter pub get --enforce-lockfile`, so a build can't silently pick
# up anything else, transitive packages included.
dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: 2.17.2

  # Push notifications
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10

  # Subscriptions (RevenueCat)
  purchases_flutter: 8.11.0

  # Product analytics (hashed user id only)
  posthog_flutter: 5.50.0

  # Device integration
  url_launcher: 6.3.2
  share_plus: 13.3.0
  add_2_calendar: 3.1.1
  device_calendar: 4.3.3

  # Utilities
  http: 1.6.0
  crypto: 3.0.7
  flutter_local_notifications: 22.3.1
  timezone: 0.11.1
  image_picker: 1.2.3

# device_calendar 4.3.3 still declares timezone ^0.9 while
# flutter_local_notifications needs 0.11; the two timezone APIs the calendar
# plugin uses (TZDateTime, Location) are unchanged between them, and the
# plugin's own code is checked against 0.11 in test/release_audit_test.dart.
dependency_overrides:
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  # Material's icon font is not used by the app's own UI (every glyph is
  # hand-drawn — lib/widgets/brass_glyph.dart). It stays enabled only because
  # framework internals (e.g. the text-selection toolbar's overflow arrow)
  # reference it; release builds tree-shake it down to the glyphs actually used.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/OFL.txt

  # EB Garamond, bundled (SIL Open Font License, assets/fonts/OFL.txt) so type
  # never falls back to the system font on a cold or offline launch. One file
  # per weight and style: the exact static instances Google Fonts serves.
  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/EBGaramond-Bold.ttf
          weight: 700
        - asset: assets/fonts/EBGaramond-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
        - asset: assets/fonts/EBGaramond-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/EBGaramond-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/EBGaramond-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/EBGaramond-ExtraBoldItalic.ttf
          weight: 800
          style: italic

# App icons: `dart run flutter_launcher_icons` (re-run after changing the art;
# the generated files are committed). Source art is the transparent arch; every
# icon sits on the app's antique parchment, #F9F6F0.
flutter_launcher_icons:
  # iOS: App Store icons must have no transparency, so it is flattened onto
  # the parchment (remove_alpha_ios) — no alpha channel in any generated size.
  ios: true
  image_path_ios: "assets/images/the_trellis_icon_transparent.png"
  remove_alpha_ios: true
  background_color_ios: "#F9F6F0"

  # Android: an adaptive icon (parchment layer + the transparent arch on top)
  # for Android 8+, and a pre-flattened square for older launchers. The inset
  # keeps the arch inside the area every launcher mask (circle, squircle...)
  # leaves visible.
  android: "ic_launcher"
  image_path_android: "assets/icon/the_trellis_icon_parchment.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F9F6F0"
  adaptive_icon_foreground: "assets/images/the_trellis_icon_transparent.png"
  adaptive_icon_foreground_inset: 16

  # Not shipped; the web build is only a development preview.
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
